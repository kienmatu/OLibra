# OLibra — local and self-hosted stack.
#
#   docker compose up -d
#
# Data lives under ./data on the host, not inside the containers, so
# `docker compose down` — even with -v — cannot take the parish's records with
# it. Back up that one directory and you have backed up everything.

name: olibra

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    # Pinned to the minor. A silent major bump on `docker compose pull` will
    # refuse to start against an existing data directory — the good outcome;
    # the bad one is finding that out during a deploy.
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olibra}
      POSTGRES_USER: ${POSTGRES_USER:-olibra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Vietnamese text sorting is not something to leave to whatever the base
      # image picked. Changing it later means a dump and reload.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    # `DateStyle` is pinned for the same reason the locale is, and with a
    # sharper failure. Postgres inherits it from the image default — `ISO, MDY`
    # in this one — and it decides how an ambiguous date *string* is read.
    # Measured through this application's driver against an `ISO, MDY` server:
    # `02/04/2015`, which is how 2 April 2015 is written in Vietnamese, is
    # stored as `2015-02-03`. A child's date of birth, wrong, with nothing
    # raised anywhere.
    #
    # `assertStorableDate` in `src/domain/members/profile-fields.ts` is the real
    # rule and refuses anything that is not `YYYY-MM-DD` before it reaches the
    # database — DATABASE.md §2.2's point about `TimeZone` applies unchanged: a
    # session setting must never be what correctness rests on, because a web
    # request, a migration console and a background job may each carry a
    # different one. This is the other half: a `psql` session, a restore, or a
    # future job that bypasses the domain now inherits an unambiguous ordering
    # rather than the image's guess.
    command: ["postgres", "-c", "datestyle=ISO, YMD"]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      # 5435, not 5432: a developer machine usually already has a Postgres
      # on the default port, and the failure is a confusing "port already
      # allocated" at the worst moment. The container still listens on 5432
      # internally — only the host mapping moves.
      - "${POSTGRES_PORT:-5435}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-olibra} -d ${POSTGRES_DB:-olibra}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── PostgreSQL, for tests ──────────────────────────────────────────────────
  # A separate service, not a separate database on `db`. The suite truncates
  # every table between tests; pointing it at the development database would
  # make `bun run test` a destructive command, and that is a footgun that only
  # has to fire once.
  #
  # Behind a profile, so `docker compose up -d` does not start it. Run:
  #
  #   docker compose --profile test up -d db-test
  #
  # tmpfs rather than a bind mount: test data is worthless by definition and
  # memory is substantially faster. Nothing here survives a restart, on purpose.
  db-test:
    image: postgres:16.10-alpine
    restart: unless-stopped
    profiles: ["test"]
    environment:
      POSTGRES_DB: olibra_test
      POSTGRES_USER: olibra
      POSTGRES_PASSWORD: olibra
      # Same locale as the real database. A suite that sorts Vietnamese text
      # differently from production is a suite that agrees with itself and not
      # with the thing it is testing.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    # Same pin as `db` above, and for the reason the locale comment gives: a
    # suite that reads dates differently from production is a suite that agrees
    # with itself and not with the thing it is testing.
    command: ["postgres", "-c", "datestyle=ISO, YMD"]
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "${POSTGRES_TEST_PORT:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olibra -d olibra_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Object storage ─────────────────────────────────────────────────────────
  # MinIO is an *implementation* of the S3 API, not the interface. The
  # application only ever speaks S3 (see .env.example), so swapping this for
  # AWS S3, Cloudflare R2 or Backblaze B2 is a change of environment variables
  # and nothing else. Nothing in the app may import a MinIO SDK.
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - ./data/minio:/data
    ports:
      - "${S3_PORT:-9000}:9000" # API
      - "${S3_CONSOLE_PORT:-9001}:9001" # web console, local convenience only
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Creates the bucket once and exits. Idempotent, so a restart is harmless.
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      storage:
        condition: service_healthy
    # Opening the bucket is not optional decoration: a bucket is private by
    # default, so without a policy `ObjectStore.url()` returns a perfectly
    # correct URL that answers 403 to a browser — every cover and avatar in the
    # app is a broken image, and nothing in the server logs says why.
    #
    # It is written out in full with `anonymous set-json` rather than with the
    # shorthand `mc anonymous set download`, and that is the whole point of the
    # verbosity. `download` is *not* read-only: it emits two statements, and the
    # first grants `s3:GetBucketLocation` **and `s3:ListBucket`** on the bucket
    # itself. An unauthenticated `GET /<bucket>/?list-type=2` then answers 200
    # and paginates the key of every avatar, cover and condition photograph —
    # and the avatars are photographs of children. Opaque UUID keys (SDD §6.8,
    # `objectKey()`) protect nothing once the keys can be enumerated. The
    # application never lists a bucket, so the narrower policy costs nothing.
    #
    # The document below is byte-compared against the one
    # `tests/support/bucket-policy.ts` defines — the policy the storage suite
    # applies to its own bucket — by
    # `tests/architecture/compose-grants-only-get-object.test.ts`. Change one
    # and that test names the other. It was two hand-maintained copies that let
    # this drift in the first place: the suite was green because it applied its
    # own, narrower policy over the top and never used what ships here.
    #
    # The resource is the whole bucket rather than a prefix, deliberately: every
    # object this application writes is fetched by a browser from an `<img>`
    # tag, so there is no private prefix for a narrower rule to protect. See
    # `tests/support/bucket-policy.ts` for the longer form of that argument.
    #
    # List form rather than a folded string, because the policy contains double
    # quotes and the shell-splitting compose applies to a bare string entrypoint
    # is not somewhere to find out how it escapes them.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set olibra http://storage:9000 '${S3_ACCESS_KEY_ID}' '${S3_SECRET_ACCESS_KEY}'
        mc mb --ignore-existing olibra/${S3_BUCKET:-olibra}
        printf %s '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::${S3_BUCKET:-olibra}/*"]}]}' > /tmp/public-read.json
        mc anonymous set-json /tmp/public-read.json olibra/${S3_BUCKET:-olibra}
        echo 'bucket ready: ${S3_BUCKET:-olibra}'
    restart: "no"

  # ── Application ────────────────────────────────────────────────────────────
  app:
    build:
      # Context is the repo root, not this directory: package.json/bun.lock
      # live there (shared with the Laravel app at app/, see AGENTS.md), and
      # Dockerfile's `COPY package.json bun.lock ./` needs them in context.
      context: ..
      dockerfile: old_next/Dockerfile
      # Not the implicit last stage — see the identical `target: runner` on
      # `sweep`'s `build:` below for why `docker compose build`/`up --build`
      # must not fall through to the `smoke` stage by omission. Kept here too,
      # even though `sweep`'s explanation already carries it, because this
      # line is the one that matters most: `app` is the service every
      # developer runs, and it was the one silently exposed to a build target
      # that was never meant to gate anything but CI.
      target: runner
    # Named explicitly, and reused verbatim by `sweep` below, so "the sweep
    # runs off the same image as the app" is a fact this file states rather
    # than an accident of two identical `build:` blocks that happen to agree.
    image: olibra-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      # CRITICAL 2: the application connects as olibra_pool, not the olibra
      # superuser — a superuser bypasses row level security unconditionally
      # (DATABASE.md §3), which made every RLS policy in this project inert
      # on the real connection path until this was wired. olibra_pool is
      # created by 20260808_13_pool_role.sql, granted membership in
      # olibra_app (and, for the deliberate cross-shelf admin path,
      # olibra_admin) — but that migration has to run *before* this
      # container's first request, and it must run as the superuser, which
      # is exactly what MIGRATION_DATABASE_URL below is for.
      DATABASE_URL: postgres://olibra_pool:${OLIBRA_POOL_PASSWORD:?set OLIBRA_POOL_PASSWORD in .env}@db:5432/${POSTGRES_DB:-olibra}
      # `bun run db:migrate` / `bun run db:seed` (docker compose exec app ...)
      # need the olibra superuser's privileges — creating roles, enabling
      # row level security — that olibra_pool must never have. Not used by
      # the running server itself; see src/db/migrate-cli.ts, src/db/seed-cli.ts.
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-olibra}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-olibra}
      # Provider-neutral on purpose — see .env.example.
      S3_ENDPOINT: http://storage:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-olibra}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      # MinIO addresses buckets by path; AWS S3 uses the host name. This is
      # configuration rather than an assumption precisely so the storage
      # provider can change without touching code.
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      TZ: Asia/Ho_Chi_Minh
    ports:
      # 3001, not 3000, so `bun run dev` keeps 3000 to itself. Running the
      # container and the dev server at once is the normal case, not the
      # exception — one is what you are changing, the other is what you are
      # comparing against.
      - "${APP_PORT:-3001}:3000"

  # ── Reminder sweep ───────────────────────────────────────────────────────
  # QA remediation Task 24. `bun run db:sweep` (`sweepDueNotifications`,
  # `src/domain/notifications/sweep.ts`) is the one scheduled job OPS §7
  # permits — BR §15's "nhắc trả sách" reminders, three days before a loan
  # falls due and again once it lapses. Until this task nothing called it in
  # any deployment: no cron entry, no compose service, no workflow. The
  # database backing that finding is a matter of record — a full borrow →
  # overdue cycle on 2026-08-10 left the QA database holding exactly one
  # notification, and it was `membership_approved`, not either reminder.
  #
  # **Same image as `app` (see the comment on `app`'s `image:` above), not a
  # second Dockerfile.** That only became true because `output: "standalone"`
  # left the image with no way to run this command at all — the Dockerfile's
  # own "CLI scripts" comment on the `runner` stage has the fuller story and
  # the exact error a build without that fix produces. `docker compose exec
  # app bun run db:migrate` (see `app`'s `MIGRATION_DATABASE_URL` comment,
  # which describes that usage) was equally broken until the same fix, which
  # this task made as part of getting `bun run db:sweep` to run anywhere
  # other than a developer's own machine.
  #
  # **A shell loop, not `cron` or `crond`.** Neither is installed in
  # `oven/bun`'s image, and adding a second process supervisor (`cron` plus
  # this container's own PID 1) to run one command once a day is more moving
  # parts than the job is worth. The loop below wakes every 20 seconds,
  # compares the container's local clock (TZ below) against 07:00, and runs
  # at most once per calendar day — `last_run` guards against firing twice
  # inside the same minute, which the sweep's own idempotence (`not exists`,
  # not a cursor — see `sweep.ts`) would also absorb harmlessly if it ever
  # happened, but there is no reason to lean on that here.
  #
  # A run does not happen the instant this container starts, only at the next
  # 07:00 boundary — matching an ordinary crontab entry `0 7 * * *`, which
  # would not fire immediately either if installed at 14:00. `docs/
  # OPERATIONS.md` §7's addendum covers running it by hand for anyone who
  # does want it right now, without waiting for the clock.
  #
  # A failed run is logged and the loop continues rather than exiting — this
  # container exiting would hand `restart: unless-stopped` a crash loop that
  # could retry several times inside the same 07:00 minute, which is a worse
  # failure mode than "tomorrow's run tries again." `bun run db:sweep` itself
  # still exits non-zero on failure (its own docstring: "so a scheduler
  # notices"); this loop is the scheduler, and it notices in its own log
  # rather than by dying.
  sweep:
    build:
      # Context is the repo root, not this directory: package.json/bun.lock
      # live there (shared with the Laravel app at app/, see AGENTS.md), and
      # Dockerfile's `COPY package.json bun.lock ./` needs them in context.
      context: ..
      dockerfile: old_next/Dockerfile
      # Not the implicit last stage. The Dockerfile's own comment on `smoke`
      # says it plainly: "Not part of the runtime image. Built explicitly in
      # CI" (`ci.yml`'s `image` job does exactly that: `docker build --target
      # smoke .`, on its own, as a Bun-compatibility check). Without `target:`
      # here, `docker compose build` builds through to `smoke` anyway, purely
      # because it is the last `FROM` in the file — and its `RUN` step boots
      # the server with none of the environment a real boot has, so it is one
      # unrelated regression away from taking `docker compose up` down with
      # it. Verified rather than assumed while wiring the `sweep` service
      # below: `docker build --target smoke .`, run standalone against this
      # branch exactly as CI runs it, currently fails — `⨯ Error: DATABASE_URL
      # is not set` — for reasons that have nothing to do with either service
      # in this file. `target: runner` is the fix for compose specifically:
      # stop at the image CI itself promotes into `app`/`sweep`, and leave the
      # smoke check exactly where its own comment already puts it.
      target: runner
    image: olibra-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Not DATABASE_URL. `sweep-cli.ts`'s own docstring gives the reason at
      # length: DATABASE_URL names olibra_pool, which 20260808_13_pool_role.sql
      # deliberately does not make a member of olibra_admin, and the sweep's
      # first statement is `set local role olibra_admin` because it spans
      # every shelf. Under olibra_pool that is `42501: permission denied to
      # set role` — correct, and not a useful way to discover the requirement
      # at 07:00.
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-olibra}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-olibra}
      TZ: Asia/Ho_Chi_Minh
    # `$` is doubled throughout (`$$now`, `$$(date …)`, …) because this text
    # goes through *two* substitution passes before a byte of it runs: Compose
    # interpolates `$VAR`/`${VAR}` in every string in this file first (the
    # mechanism `${S3_ACCESS_KEY_ID}` above and `storage-init`'s entrypoint
    # rely on), and only what survives that pass reaches the container's own
    # shell as the script it actually executes. A single `$` here is not "the
    # shell will see this" — it is "Compose will try to resolve this against
    # its own variables first," and `$today`/`$now`/`$last_run` are not among
    # those, so the first draft of this script silently ran with those three
    # replaced by empty strings and `$TZ` baked in at build time from `.env`
    # rather than read from the container's own environment — caught by
    # `docker compose config sweep`, which is why it is worth re-running after
    # touching this block rather than trusting the YAML to mean what it says.
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo "sweep: scheduler started — runs \`bun run db:sweep\` once a day at 07:00 $$TZ"
        last_run=""
        while true; do
          today=$$(date +%F)
          now=$$(date +%H:%M)
          if [ "$$now" = "07:00" ] && [ "$$last_run" != "$$today" ]; then
            echo "sweep: 07:00 $$TZ reached — running for $$today"
            if bun run db:sweep; then
              echo "sweep: $$today run finished"
            else
              echo "sweep: $$today run FAILED (exit $$?) — will try again at 07:00 tomorrow"
            fi
            last_run="$$today"
          fi
          sleep 20
        done
