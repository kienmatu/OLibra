name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: olibra_test
          POSTGRES_USER: olibra
          POSTGRES_PASSWORD: olibra
        ports: ["5436:5432"]
        options: >-
          --health-cmd "pg_isready -U olibra -d olibra_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://olibra:olibra@localhost:5436/olibra_test
      # The pool role is a genuine non-superuser, so RLS actually binds it —
      # that is the whole point of `tests/db/pool-role-privileges.test.ts`,
      # which asserts `rolsuper = false` before running the guard path through
      # this handle. A superuser handle would pass every scoping test while
      # proving nothing.
      TEST_POOL_DATABASE_URL: postgres://olibra_pool:olibra_pool@localhost:5436/olibra_test
      # `20260808_13_pool_role.sql` templates its password from the
      # environment rather than hard-coding one into every deployment, so the
      # migration runner refuses to render without this. A throwaway value is
      # correct here: this database is created and destroyed per CI run.
      OLIBRA_POOL_PASSWORD: olibra_pool
      # B5. The storage suite runs against a real MinIO, the same way the
      # database suite runs against a real PostgreSQL — a mocked S3 client
      # would assert that we call the SDK the way we think we do, which is the
      # claim least likely to be wrong. These mirror the seven S3_* variables
      # the application reads rather than reusing them, so pointing the suite
      # somewhere never touches the application's own configuration; the
      # bucket has to contain "test" or tests/support/env.ts refuses it,
      # because the suite deletes objects.
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_REGION: us-east-1
      TEST_S3_BUCKET: olibra-test
      # Throwaway, like OLIBRA_POOL_PASSWORD above: this MinIO is created and
      # destroyed per run and is reachable only from the runner. MinIO refuses
      # a root password shorter than eight characters.
      TEST_S3_ACCESS_KEY_ID: olibra_test
      TEST_S3_SECRET_ACCESS_KEY: olibra_test_secret
      TEST_S3_FORCE_PATH_STYLE: "true"
      # Deliberately the same host as the endpoint here, unlike compose, where
      # the server reaches `http://storage:9000` and a browser cannot. The
      # distinction is covered by construction in tests/storage/s3.test.ts
      # rather than by the CI topology.
      TEST_S3_PUBLIC_URL: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      # A `docker run` rather than a service container, because service
      # containers cannot pass a command and `minio/minio` needs
      # `server /data`. The tag is pinned to compose.yaml's, and
      # tests/architecture/ci-pins-the-storage-image.test.ts fails if the two
      # ever drift. The bucket is not created here: the suite creates it with
      # CreateBucketCommand, which is one less image to pull and one less tag
      # to keep pinned.
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=olibra_test \
            -e MINIO_ROOT_PASSWORD=olibra_test_secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live -o /dev/null; then
              echo "minio is up after ${i} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "minio never came up after 30 attempts" >&2
          docker logs minio >&2
          exit 1
      # `tests/lib/qr-labels-decode.test.ts` rasterises a generated label sheet
      # with `pdftoppm` and decodes the QR symbols back. That test exists
      # because two real layout bugs in this feature were invisible to every
      # other kind of check; without poppler here it would be skipped exactly
      # where it matters most.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
        env: { PUPPETEER_SKIP_DOWNLOAD: 1 }
      - run: bun run check

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The smoke stage boots the built server under Bun and fails unless it
      # serves the landing page. Next.js does not test against Bun, so this is
      # what stops a Next upgrade quietly shipping a runtime that starts and
      # then serves nothing.
      - run: docker build --target smoke .

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # U1: the crawler needs a database now. It used to say the opposite here,
    # and that was true while all forty-seven pages rendered from
    # `src/lib/fixtures.ts`. `quan-ly/cho-muon` is a real read as of this
    # slice, so without a database it does not render at all — and it 404s for
    # a stranger by design (U1 §3.4), so the crawler signs in as the manager
    # `bun run db:seed` creates. That is why `db:migrate` and `db:seed` run
    # below, before the dev server does.
    #
    # This is the application's own database (`olibra`, on 5435, matching
    # compose.yaml), not the suite's `olibra_test` on 5436 — the crawler
    # exercises the running app, not the test harness, and nothing here
    # truncates anything.
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: olibra
          POSTGRES_USER: olibra
          POSTGRES_PASSWORD: olibra
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U olibra -d olibra"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # What the dev server connects as: olibra_pool, the genuine
      # non-superuser, exactly as compose.yaml's `app` service does. Crawling
      # against a superuser handle would render every page with RLS inert,
      # which is the one thing this crawl must not be able to hide.
      DATABASE_URL: postgres://olibra_pool:olibra_pool@localhost:5435/olibra
      # What `db:migrate`, `db:seed` and the crawler's own sign-in connect as.
      MIGRATION_DATABASE_URL: postgres://olibra:olibra@localhost:5435/olibra
      # `20260808_13_pool_role.sql` templates the pool role's password from the
      # environment. Throwaway, like the `check` job's: this database is
      # created and destroyed per run.
      OLIBRA_POOL_PASSWORD: olibra_pool
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
        env: { PUPPETEER_SKIP_DOWNLOAD: 1 }
      - run: bun run db:migrate
      - run: bun run db:seed
      # `nohup ... &` detaches the dev server from the step's own stdout/
      # stderr. A plain `bun run dev &` still inherits them, so the step
      # doesn't exit until the runner decides those pipes are done — normally
      # invisible, but it has left backgrounded dev-server jobs hanging on CI
      # runners before. Redirecting to /dev/null removes that dependency
      # entirely.
      - run: nohup bun run dev > /dev/null 2>&1 &
      - name: Wait for the dev server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ -o /dev/null; then
              echo "dev server is up after ${i} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "dev server never came up after 30 attempts" >&2
          exit 1
      - run: bun run check:links
